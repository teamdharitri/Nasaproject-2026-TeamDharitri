function hash(x,y,z){

  let n =
    Math.imul(x,374761393) ^
    Math.imul(y,668265263) ^
    Math.imul(z,1274126177);

  n = Math.imul(
    n ^ (n >>> 13),
    1103515245
  );

  return ((n ^ (n >>> 16)) >>> 0)
    / 4294967296;

}


function lerp(a,b,t){

  return a + (b-a)*t;

}


function valueNoise(x,y,z){

  const X = Math.floor(x);
  const Y = Math.floor(y);
  const Z = Math.floor(z);

  const a = x-X;
  const b = y-Y;
  const c = z-Z;

  const u = a*a*(3-2*a);
  const v = b*b*(3-2*b);
  const w = c*c*(3-2*c);


  const x00 = lerp(
    hash(X,Y,Z),
    hash(X+1,Y,Z),
    u
  );

  const x10 = lerp(
    hash(X,Y+1,Z),
    hash(X+1,Y+1,Z),
    u
  );

  const x01 = lerp(
    hash(X,Y,Z+1),
    hash(X+1,Y,Z+1),
    u
  );

  const x11 = lerp(
    hash(X,Y+1,Z+1),
    hash(X+1,Y+1,Z+1),
    u
  );


  return lerp(
    lerp(x00,x10,v),
    lerp(x01,x11,v),
    w
  );

}


function fb(x,y,z,o){

  let s = 0;
  let a = .5;

  for(let i=0;i<o;i++){

    s += a * valueNoise(x,y,z);

    x *= 2.07;
    y *= 2.07;
    z *= 2.07;

    a *= .5;

  }

  return s;

}


function makeTexture(){
  const W = 1024;
  const H = 512;
  const c = document.createElement('canvas');
  c.width = W;
  c.height = H;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(W,H);

  // Deterministic multi-octave terrain noise.
  for(let j=0;j<H;j++){
    const lat = (.5-(j+.5)/H)*Math.PI;
    const cp = Math.cos(lat);
    const sp = Math.sin(lat);

    for(let i=0;i<W;i++){
      const lon = (i+.5)/W * Math.PI*2;
      const x = -Math.cos(lon)*cp;
      const z =  Math.sin(lon)*cp;

      const broad = fb(x*1.55+11, sp*1.55+11, z*1.55+11, 6);
      const medium = fb(x*5.5+31, sp*5.5+31, z*5.5+31, 5);
      const fine = fb(x*16+71, sp*16+71, z*16+71, 4);

      // Southern highlands and northern lowlands.
      const highland = smoothstep(-.18,.72,Math.abs(sp)+broad*.22);
      const darkRegion = smoothstep(.54,.88,Math.abs(sp))*0.16;

      // MARS-like rusty palette with broad regional variation.
      let r = 82 + broad*105 + medium*34 - darkRegion*35 + highland*8;
      let g = 34 + broad*62  + medium*23 - darkRegion*13 + highland*2;
      let b = 20 + broad*35  + medium*16 - darkRegion*8;

      // Subtle basaltic dark patches.
      const basalt = smoothstep(.61,.78,medium) * smoothstep(.62,.88,broad);
      r -= basalt*20; g -= basalt*10; b -= basalt*5;

      // Fine dusty grain.
      r += (fine-.5)*22;
      g += (fine-.5)*12;
      b += (fine-.5)*7;

      // Polar ice caps.
      const pole = smoothstep(.88,.985,Math.abs(sp));
      r = lerp(r, 224, pole);
      g = lerp(g, 221, pole);
      b = lerp(b, 213, pole);

      // Slight latitude-dependent atmospheric haze.
      const haze = smoothstep(.93,1.0,Math.abs(sp));
      r = lerp(r, 196, haze*.25);
      g = lerp(g, 190, haze*.25);
      b = lerp(b, 181, haze*.25);

      const q=(j*W+i)*4;
      img.data[q]   = Math.max(0,Math.min(255,r));
      img.data[q+1] = Math.max(0,Math.min(255,g));
      img.data[q+2] = Math.max(0,Math.min(255,b));
      img.data[q+3] = 255;
    }
  }

  ctx.putImageData(img,0,0);

  // Add hundreds of soft crater depressions directly to the color map.
  let seed = 93721;
  const rnd = ()=>{
    seed = (seed*1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };

  for(let n=0;n<300;n++){
    const x=rnd()*W, y=rnd()*H;
    const rr=2+rnd()*24;
    const grd=ctx.createRadialGradient(x,y,0,x,y,rr);
    grd.addColorStop(0,'rgba(42,18,10,.28)');
    grd.addColorStop(.45,'rgba(62,26,13,.18)');
    grd.addColorStop(.72,'rgba(210,103,55,.07)');
    grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grd;
    ctx.beginPath();
    ctx.arc(x,y,rr,0,Math.PI*2);
    ctx.fill();
  }

  return c;
}

function smoothstep(a,b,x){
  const t=Math.max(0,Math.min(1,(x-a)/(b-a)));
  return t*t*(3-2*t);
}

function makeBumpTexture(){
  const W = 512;
  const H = 256;
  const c = document.createElement('canvas');
  c.width=W; c.height=H;
  const ctx=c.getContext('2d');
  const img=ctx.createImageData(W,H);

  for(let j=0;j<H;j++){
    const lat=(.5-(j+.5)/H)*Math.PI;
    const cp=Math.cos(lat), sp=Math.sin(lat);

    for(let i=0;i<W;i++){
      const lon=(i+.5)/W*Math.PI*2;
      const x=-Math.cos(lon)*cp;
      const z=Math.sin(lon)*cp;

      const terrain =
        fb(x*3.2+19,sp*3.2+19,z*3.2+19,5)*.68 +
        fb(x*10+47,sp*10+47,z*10+47,4)*.32;

      const v=Math.max(0,Math.min(255,82+terrain*150));
      const q=(j*W+i)*4;
      img.data[q]=v;
      img.data[q+1]=v;
      img.data[q+2]=v;
      img.data[q+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  return c;
}

function buildMARS(){

  const marsCanvas = makeTexture();
  const bumpCanvas = makeBumpTexture();


  const tx =
    new THREE.CanvasTexture(
      marsCanvas
    );

  const tb =
    new THREE.CanvasTexture(
      bumpCanvas
    );


  tx.encoding =
    THREE.sRGBEncoding;

  tx.anisotropy = Math.min(8, ren.capabilities.getMaxAnisotropy());


  const mars =
    new THREE.Mesh(

      new THREE.SphereGeometry(
        1,
        96,
        64
      ),

      new THREE.MeshStandardMaterial({
        map:tx,
        bumpMap:tb,
        bumpScale:.08,
        roughness:1,
        metalness:0
      })

    );


  sc.add(mars);


  const atmosphere =
    new THREE.Mesh(

      new THREE.SphereGeometry(
        1.14,
        64,
        64
      ),

      new THREE.ShaderMaterial({

        uniforms:U,

        transparent:true,

        side:THREE.BackSide,

        blending:
          THREE.AdditiveBlending,

        depthWrite:false,

        vertexShader:`

          varying vec3 n;

          void main(){

            n=normalize(
              normalMatrix*normal
            );

            gl_Position=
              projectionMatrix*
              modelViewMatrix*
              vec4(position,1.);

          }

        `,

        fragmentShader:`

          uniform vec3 sd;

          varying vec3 n;

          void main(){

            float s=
              clamp(
                -n.z/.48,
                0.,
                1.
              );

            float l=
              .25+
              .75*
              smoothstep(
                -.4,
                .8,
                dot(
                  normalize(
                    n.xy+
                    vec2(1e-4)
                  ),
                  normalize(
                    sd.xy+
                    vec2(1e-4)
                  )
                )
              );

            gl_FragColor=
              vec4(
                1.,
                .52,
                .32,
                1.
              )*
              pow(s,2.2)*
              l*
              1.1;

          }

        `

      })

    );


  sc.add(atmosphere);

  // Very subtle dusty limb glow for a more cinematic, realistic MARS edge.
  const dust = new THREE.Mesh(
    new THREE.SphereGeometry(1.035,64,64),
    new THREE.MeshBasicMaterial({
      color:0xb85f36,
      transparent:true,
      opacity:.045,
      side:THREE.BackSide,
      blending:THREE.AdditiveBlending,
      depthWrite:false
    })
  );
  sc.add(dust);

}


function makeStars(){

  const group =
    new THREE.Group();

  sc.add(group);

  bg=group;


  const starPositions=[];
  const starColors=[];


  for(let n=0;n<2200;){

    const u=
      Math.random()*2-1;

    const t=
      Math.random()*Math.PI*2;

    const r=
      Math.sqrt(1-u*u);

    const x=
      r*Math.cos(t);

    const z=
      r*Math.sin(t);


    if(
      Math.random() >
      .18+
      .82*
      Math.exp(
        -Math.pow(
          (u*.8+x*.6)*2.6,
          2
        )
      )
    ){

      continue;

    }


    starPositions.push(
      x*90,
      u*90,
      z*90
    );


    const c =
      new THREE.Color();

    c.setHSL(
      Math.random()<.7?.6:.08,
      .5,
      .6+Math.random()*.4
    );

    starColors.push(
      c.r,
      c.g,
      c.b
    );

    n++;

  }


  const geometry =
    new THREE.BufferGeometry();

  geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(
      starPositions,
      3
    )
  );

  geometry.setAttribute(
    'color',
    new THREE.Float32BufferAttribute(
      starColors,
      3
    )
  );


  const stars =
    new THREE.Points(

      geometry,

      new THREE.PointsMaterial({
        size:.3,
        vertexColors:true,
        transparent:true,
        opacity:.85,
        depthWrite:false
      })

    );


  group.add(stars);

}


function buildGrid(){

  const gp=[];


  for(
    let la=-60;
    la<=60;
    la+=30
  ){

    for(
      let i=0;
      i<96;
      i++
    ){

      gp.push(
        P(
          la,
          i*3.75,
          1.002
        ),

        P(
          la,
          (i+1)*3.75,
          1.002
        )
      );

    }

  }


  for(
    let lo=0;
    lo<360;
    lo+=30
  ){

    for(
      let j=-90;
      j<90;
      j+=5
    ){

      gp.push(
        P(j,lo,1.002),
        P(j+5,lo,1.002)
      );

    }

  }


  const geometry =
    new THREE.BufferGeometry()
      .setFromPoints(gp);


  const grid =
    new THREE.LineSegments(

      geometry,

      new THREE.LineBasicMaterial({
        color:0xffffff,
        transparent:true,
        opacity:.16
      })

    );


  grid.visible=false;

  sc.add(grid);

  return grid;

}


function makeGlowTexture(){

  const c=
    document.createElement('canvas');

  c.width=c.height=128;

  const ctx=c.getContext('2d');

  const g=
    ctx.createRadialGradient(
      64,64,0,
      64,64,64
    );

  g.addColorStop(
    0,
    'rgba(255,255,255,1)'
  );

  g.addColorStop(
    .3,
    'rgba(255,255,255,.45)'
  );

  g.addColorStop(
    1,
    'rgba(255,255,255,0)'
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,0,128,128
  );

  return new THREE.CanvasTexture(c);

}


function buildMarkers(){

  const glow =
    makeGlowTexture();


  mk=M.map((m,i)=>{

    const col=
      new THREE.Color(C[m.k]);


    const p0=
      P(m.la,m.lo,1.003);

    const p1=
      P(m.la,m.lo,1.07);


    const g=
      new THREE.Group();


    const line=
      new THREE.Line(

        new THREE.BufferGeometry()
          .setFromPoints([
            p0,p1
          ]),

        new THREE.LineBasicMaterial({
          color:col,
          transparent:true,
          opacity:.8
        })

      );


    const bd=
      new THREE.Mesh(

        new THREE.SphereGeometry(
          .016,
          16,
          16
        ),

        new THREE.MeshBasicMaterial({
          color:col
        })

      );


    bd.position.copy(p1);


    const ring=
      new THREE.Mesh(

        new THREE.RingGeometry(
          .022,
          .028,
          40
        ),

        new THREE.MeshBasicMaterial({
          color:col,
          transparent:true,
          side:THREE.DoubleSide,
          depthWrite:false
        })

      );


    ring.position.copy(p0);

    ring.lookAt(
      P(
        m.la,
        m.lo,
        2
      )
    );


    const sprite=
      new THREE.Sprite(

        new THREE.SpriteMaterial({
          map:glow,
          color:col,
          blending:
            THREE.AdditiveBlending,
          depthWrite:false,
          transparent:true
        })

      );


    sprite.scale.setScalar(.16);

    sprite.position.copy(p1);


    g.add(
      line,
      bd,
      ring,
      sprite
    );


    sc.add(g);


    const el=
      document.createElement('div');

    el.className='l';

    el.textContent=m.n;

    el.style.borderColor=
      C[m.k]+'99';

    el.onclick=()=>{
      selectMission(i);
    };

    $('#L').appendChild(el);


    const chip=
      document.createElement('button');

    chip.className='chip';

    chip.innerHTML=
      '<i class="d" style="background:'+
      C[m.k]+
      '"></i>'+
      m.n;

    chip.onclick=()=>{
      selectMission(i);
    };

    $('#rw').appendChild(chip);


    return {
      g,
      bd,
      rg:ring,
      el,
      ch:chip,
      p:p1,
      m,
      sp:sprite
    };

  });

}


function createFilters(grid){

  [0,1].forEach(k=>{

    const b=
      document.createElement('button');

    b.className='f';

    b.innerHTML=
      '<i class="d" style="background:'+
      C[k]+
      '"></i>'+
      S[k]+
      ' ('+
      M.filter(
        m=>m.k===k
      ).length+
      ')';


    b.onclick=()=>{

      b.classList.toggle('off');

      mk.forEach(o=>{

        if(o.m.k===k){

          const visible=
            !o.g.visible;

          o.g.visible=
            visible;

          o.ch.style.display=
            visible?'':'none';

        }

      });

    };


    $('#fl').appendChild(b);

  });


  const gridButton=
    document.createElement('button');

  gridButton.className='f off';

  gridButton.textContent='Grid';

  gridButton.onclick=()=>{

    grid.visible=
      !grid.visible;

    gridButton.classList.toggle(
      'off',
      !grid.visible
    );

  };

  $('#fl').appendChild(gridButton);


  const orbitButton=
    document.createElement('button');

  orbitButton.className='f off';

  orbitButton.textContent='Orbit View';

  orbitButton.onclick=()=>{

    ov = ov ? 0 : 1;

    orbitButton.classList.toggle(
      'off',
      !ov
    );

    orbitButton.textContent=
      ov ?
      'Landing View' :
      'Orbit View';


    go(

      ov
      ? new THREE.Vector3(.45,.6,1)
      : new THREE.Vector3(0,.55,1),

      ov ? OD : D0

    );

  };


  $('#fl').appendChild(
    orbitButton
  );

}


const LA={

  'Viking 1':'Aug 20, 1975',
  'Viking 2':'Sep 9, 1975',
  'Pathfinder':'Dec 4, 1996',
  'Spirit':'Jun 10, 2003',
  'Opportunity':'Jul 7, 2003',
  'Phoenix':'Aug 4, 2007',
  'InSight':'May 5, 2018',
  'Curiosity':'Nov 26, 2011',
  'Perseverance':'Jul 30, 2020'

};


function duration(m){

  if(m.k){

    return 'Active';

  }


  const start=
    Date.parse(m.a);

  const end=
    Date.parse(m.e);


  const months=
    Math.max(
      0,
      Math.floor(
        (end-start) /
        2629800000
      )
    );


  const years=
    Math.floor(
      months/12
    );

  const rem=
    months%12;


  let result='';

  if(years){
    result += years+' yr ';
  }

  result += rem+' mo';

  return result;

}


function selectMission(i){

  const m=M[i];

  const c=C[m.k];


  mk.forEach((o,j)=>{

    o.ch.classList.toggle(
      'on',
      j===i
    );

    o.bd.scale.setScalar(
      j===i ? 1.7 : 1
    );

    o.sp.scale.setScalar(
      j===i ? .3 : .16
    );

  });


  moons.forEach(
    m=>m.ch.classList.remove('on')
  );


  $('#card').innerHTML=`

    <div class="h">

      <i class="d"
         style="background:${c}">
      </i>

      ${m.n}

      <em style="color:${c}">
        ${S[m.k]}
      </em>

    </div>

    <p class="mt">
      ${m.t}, ${m.s}
    </p>

    <div class="g">

      <span>Coordinates</span>

      <b>
        ${Math.abs(m.la).toFixed(2)}
        °${m.la<0?'S':'N'},
        ${((m.lo+360)%360).toFixed(2)}°E
      </b>

      <span>Launch</span>
      <b>${LA[m.n]}</b>

      <span>Landing</span>
      <b>${m.a}</b>

      <span>End</span>
      <b>${m.e}</b>

      <span>Duration</span>
      <b>${duration(m)}</b>

    </div>

    <div>
      ${m.d}
    </div>

  `;


  go(
    P(m.la,m.lo,1),
    Math.min(
      cam.position.length(),
      D0*.72
    )
  );

}


function go(target,distance){

  const from=
    cam.position.clone()
      .normalize();

  const quaternion=
    new THREE.Quaternion()
      .setFromUnitVectors(
        from,
        target.clone().normalize()
      );


  fly={
    f:from,
    q:quaternion,
    d0:cam.position.length(),
    d:distance,
    k:0
  };


  ctl.autoRotate=false;

}


function buildMoons(){

  const MO=[

    {
      n:'Phobos',
      a:9378,
      T:.31891,
      i:1.08,
      r:[13,11.4,9.1],
      c:'#e0b9a1'
    },

    {
      n:'Deimos',
      a:23459,
      T:1.26244,
      i:1.79,
      r:[7.8,6,5.1],
      c:'#bdb7d6'
    }

  ];


  const geometry=
    new THREE.IcosahedronGeometry(
      1,
      3
    );


  const pp=
    geometry.attributes.position;


  for(
    let v=0;
    v<pp.count;
    v++
  ){

    const x=pp.getX(v);
    const y=pp.getY(v);
    const z=pp.getZ(v);


    const k=
      1+
      .12*
      Math.sin(x*9+y*5)*
      Math.cos(z*7+x*3);


    pp.setXYZ(
      v,
      x*k,
      y*k,
      z*k
    );

  }


  geometry.computeVertexNormals();


  moons=MO.map((o,i)=>{

    const rr=
      o.a/3389.5;


    const group=
      new THREE.Group();


    group.rotation.x=
      o.i*G;


    const points=[];


    for(
      let s=0;
      s<=160;
      s++
    ){

      const t=
        s/160*Math.PI*2;

      points.push(
        new THREE.Vector3(
          Math.cos(t)*rr,
          0,
          Math.sin(t)*rr
        )
      );

    }


    group.add(

      new THREE.Line(

        new THREE.BufferGeometry()
          .setFromPoints(points),

        new THREE.LineBasicMaterial({
          color:o.c,
          transparent:true,
          opacity:.4
        })

      )

    );


    const mesh=
      new THREE.Mesh(

        geometry,

        new THREE.MeshStandardMaterial({
          color:o.c,
          roughness:1
        })

      );


    mesh.scale.set(
      o.r[0],
      o.r[2],
      o.r[1]
    );

    mesh.scale.multiplyScalar(
      25/3389.5
    );


    group.add(mesh);

    sc.add(group);


    const el=
      document.createElement('div');

    el.className='l';

    el.textContent=o.n;

    el.style.borderColor=
      o.c+'99';

    el.onclick=()=>{
      selectMoon(i);
    };

    $('#L').appendChild(el);


    const chip=
      document.createElement('button');

    chip.className='chip';

    chip.innerHTML=
      '<i class="d" style="background:'+
      o.c+
      '"></i>'+
      o.n;

    chip.onclick=()=>{
      selectMoon(i);
    };

    $('#rw').appendChild(chip);


    return {
      o,
      rr,
      mm:mesh,
      group,
      el,
      ch:chip
    };

  });

}


function selectMoon(i){

  const o=moons[i].o;


  mk.forEach(m=>{

    m.ch.classList.remove('on');

    m.bd.scale.setScalar(1);

    m.sp.scale.setScalar(.16);

  });


  moons.forEach((m,j)=>{

    m.ch.classList.toggle(
      'on',
      j===i
    );

  });


  $('#card').innerHTML=`

    <div class="h">

      <i class="d"
         style="background:${o.c}">
      </i>

      ${o.n}

      <em style="color:${o.c}">
        Moon
      </em>

    </div>

    <p class="mt">
      Natural satellite of Mars
    </p>

    <div class="g">

      <span>Orbit</span>

      <b>
        ${o.a.toLocaleString('en')} km
      </b>

      <span>Period</span>

      <b>
        ${(o.T*24).toFixed(2)} hours
      </b>

      <span>Size</span>

      <b>
        ${o.r.map(v=>v*2).join(' × ')} km
      </b>

      <span>Orbital Inclination</span>

      <b>${o.i}°</b>

    </div>

    <div>
      The moon size is exaggerated for visibility on the map.
    </div>

  `;


  if(
    cam.position.length() < OD*.6
  ){

    go(
      new THREE.Vector3(.45,.6,1),
      OD
    );

  }

}


function animate(){

  requestAnimationFrame(
    animate
  );


  const time=
    performance.now()/1000;


  if(fly){

    fly.k=
      Math.min(
        1,
        fly.k+.025
      );


    const e=
      1-
      Math.pow(
        1-fly.k,
        3
      );


    const q=
      new THREE.Quaternion();


    q.slerpQuaternions(
      new THREE.Quaternion(),
      fly.q,
      e
    );


    cam.position
      .copy(fly.f)
      .applyQuaternion(q)
      .multiplyScalar(
        fly.d0+
        (fly.d-fly.d0)*e
      );


    if(fly.k>=1){

      fly=null;

    }

  }


  if(bg){

    bg.position.copy(
      cam.position
    );

  }


  if(cl){

    cl.rotation.y+=.0003;

  }


  U.sd.value.copy(SD);

  U.sd.value.transformDirection(
    cam.matrixWorldInverse
  );


  ctl.update();


  const w=innerWidth;
  const h=innerHeight;


  mk.forEach((o,i)=>{

    const k=
      (time*.45+i*.11)%1;


    o.rg.scale.setScalar(
      1+k*2.4
    );


    o.rg.material.opacity=
      .8*(1-k);


    const visible=
      o.g.visible;


    const facing=
      o.p.dot(cam.position)>0;


    const ok=
      visible &&
      facing;


    const projected=
      o.p.clone().project(cam);


    o.el.style.opacity=
      ok ? 1 : 0;

    o.el.style.pointerEvents=
      ok ? 'auto' : 'none';


    o.el.style.transform=
      'translate('+
      ((projected.x*.5+.5)*w)+
      'px,'+
      ((-projected.y*.5+.5)*h)+
      'px) translate(-50%,-135%)';

  });


  moons.forEach((m,i)=>{

    const theta=
      time*
      6.2832/
      (m.o.T*19.2)
      +
      i*2;


    m.mm.position.set(
      Math.cos(theta)*m.rr,
      0,
      Math.sin(theta)*m.rr
    );


    m.mm.rotation.y=
      -theta;


    const worldPosition=
      new THREE.Vector3();


    m.mm.getWorldPosition(
      worldPosition
    );


    const projected=
      worldPosition
        .clone()
        .project(cam);


    const camera=
      cam.position;


    const direction=
      worldPosition
        .clone()
        .sub(camera);


    const hidden=
      direction.dot(camera)>0;


    m.el.style.opacity=
      hidden ? 0 : 1;

    m.el.style.pointerEvents=
      hidden ? 'none' : 'auto';


    m.el.style.transform=
      'translate('+
      ((projected.x*.5+.5)*w)+
      'px,'+
      ((-projected.y*.5+.5)*h)+
      'px) translate(-50%,-170%)';

  });


  ren.render(
    sc,
    cam
  );

}

if(backBtn){
  backBtn.addEventListener('click',()=>{
    if(window.history.length > 1){
      window.history.back();
    }else{
      // Useful when this file is opened directly.
      window.location.href = 'index.html';
    }
  });
}

  if(e.key === 'Escape') backBtn?.click();
});

function init(){

  const loading = $('#ld');

  try{

    if(!window.THREE){
      throw new Error('Three.js failed to load. Check your internet connection or CDN access.');
    }

    if(!THREE.OrbitControls){
      throw new Error('OrbitControls failed to load.');
    }

    buildMARS();
    makeStars();

    const grid = buildGrid();

    buildMarkers();
    createFilters(grid);
    buildMoons();
    animate();

    setTimeout(()=>{
      if(!loading) return;
      loading.style.opacity=0;
      setTimeout(()=>loading.remove(),700);
    },300);

  }catch(error){

    console.error('Mars Landing Atlas initialization failed:', error);

    if(loading){
      loading.textContent='Unable to initialize the 3D atlas. Open the browser console for details.';
      loading.style.opacity=1;
    }

  }

}

init();
